[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tierquant-kv"
version = "0.1.0"
description = "Precision-descending KV-cache tiering: quantize KV blocks on demotion across HBM/DRAM/NVMe, under a quality budget."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy", "pyyaml"]

[project.optional-dependencies]
torch = ["torch>=2.1"]
bench = ["httpx", "matplotlib", "redis", "minio"]
eval = ["transformers>=4.40,<4.57", "datasets", "accelerate"]
gds = ["kvikio", "cupy-cuda12x"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
